name: Keeper alarm
on:
  schedule:
    - cron: '7,27,47 * * * *'  # best effort: GitHub delays these, and disables them after 60 days of repo inactivity
  workflow_dispatch:
    inputs:
      drill:
        description: Page without reading anything, to test delivery
        type: boolean
        default: false
  pull_request:
    paths:
      - keeper/alarm.py
      - keeper/test_alarm.py
      - keeper/testdata/**
      - .github/workflows/keeper-alarm.yml
permissions: {}
concurrency:
  group: keeper-alarm
  cancel-in-progress: false
jobs:
  test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s keeper -p 'test_alarm.py'
  alarm:
    if: github.event_name != 'pull_request' && github.repository == 'PeridotFinance/PeridotV2-Robinhood'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
      issues: write
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.KEEPER_ALARM_DO_READ_TOKEN }}  # optional; empty means process status unknown
      ALARM_BURN_WEI_PER_DAY: ${{ vars.KEEPER_ALARM_BURN_WEI_PER_DAY }}  # optional; empty means the measured default
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - if: env.DIGITALOCEAN_ACCESS_TOKEN != ''
        uses: digitalocean/action-doctl@135ac0aa0eed4437d547c6f12c364d3006b42824  # v2.5.1
        with:
          no_auth: true
      - name: Check the keeper (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DRILL: ${{ inputs.drill == true && '--drill' || '' }}
        run: python3 keeper/alarm.py --notify $DRILL
